$:
  vscode:
    - docker:
        image: cnbcool/default-dev-env:latest
      runner:
        cpus: 1
      services:
        - name: vscode
          options:
            keepAliveTimeout: 18h
        - docker
      stages:
        - name: start-cnb-ai-bridge
          script: |
            set -euo pipefail
            exec bash "$(pwd)/agent/supervisor.sh"
