[package]
name = "cnb-bridge-desktop"
version = "0.1.0"
edition = "2021"
description = "CNB Bridge Windows desktop shell"
build = "build.rs"

[[bin]]
name = "cnb-bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
cnb-bridge = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", default-features = false, features = [
  "common-controls-v6",
  "compression",
  "tray-icon",
  "wry",
] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1", features = ["sync"] }
url = "2.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
