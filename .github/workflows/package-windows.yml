name: Package Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  package:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content -LiteralPath "Cargo.toml" -Raw
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "Cargo.toml package version was not found"
          }
          "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify bundled installer resources
        shell: pwsh
        run: |
          $resources = @(
            @{
              Path = "installer/runtime/vcruntime140.dll"
              Length = 178616
              Sha256 = "D1F4225DF2CD877DBF130D5668A021DCE3F94118455FF5EC952061C30AFC9CE7"
            },
            @{
              Path = "installer/languages/ChineseSimplified.isl"
              Length = 20305
              Sha256 = "4040443DC615C140791951106404BD4ECBBF362DB675658212D913EBE101F1F2"
            },
            @{
              Path = "installer/assets/cnb-bridge.ico"
              Length = 34494
              Sha256 = "9B6C388B912BE73F0FC94F799B5233EBACA9CACE880767554DAEF00BE098A6B0"
            }
          )

          foreach ($resource in $resources) {
            if (-not (Test-Path -LiteralPath $resource.Path -PathType Leaf)) {
              throw "Missing installer resource: $($resource.Path)"
            }

            $item = Get-Item -LiteralPath $resource.Path
            if ($item.Length -ne $resource.Length) {
              throw "Unexpected size for $($resource.Path): $($item.Length), expected $($resource.Length)"
            }

            $actualHash = (Get-FileHash -LiteralPath $resource.Path -Algorithm SHA256).Hash
            if ($actualHash -ne $resource.Sha256) {
              throw "Unexpected SHA256 for $($resource.Path): $actualHash"
            }
          }

          $iss = Get-Content -LiteralPath "installer/cnb-bridge.iss" -Raw
          if ($iss -match "WebView2") {
            throw "Installer must not contain WebView2 detection"
          }
          if ($iss -notmatch [regex]::Escape('{#AppMutexName}')) {
            throw "Installer lifecycle mutex reference is missing"
          }
          if ($iss -notmatch [regex]::Escape('--shutdown-for-update')) {
            throw "Installer graceful shutdown argument is missing"
          }
          foreach ($marker in @(
            'taskkill.exe',
            'ShouldOfferLaunch',
            'Software\Microsoft\Windows\CurrentVersion\Run',
            'StartupApproved\Run'
          )) {
            if ($iss -notmatch [regex]::Escape($marker)) {
              throw "Installer lifecycle marker is missing: $marker"
            }
          }
          $languageSection = [regex]::Match(
            $iss,
            '(?ms)^\[Languages\]\s*(.*?)(?=^\[|\z)'
          ).Groups[1].Value
          $languageCount = [regex]::Matches($languageSection, '(?m)^Name:\s*"').Count
          if ($languageCount -ne 1) {
            throw "Expected exactly one installer language, found $languageCount"
          }

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Test frontend
        run: npm --prefix ui test

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build frontend
        run: npm --prefix ui run build

      - name: Build release desktop client
        run: cargo build --release -p cnb-bridge-desktop --features custom-protocol

      - name: Verify release executable
        shell: pwsh
        run: |
          $executable = "target/release/cnb-bridge.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Missing release executable: $executable"
          }

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" `
            -OutFile $installerPath
          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup SHA-256 mismatch: $actualHash"
          }

          $installDir = "C:\Tools\InnoSetup-6.7.3"
          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList @(
              "/VERYSILENT"
              "/SUPPRESSMSGBOXES"
              "/NORESTART"
              "/SP-"
              "/DIR=$installDir"
            ) `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)"
          }

          $iscc = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not installed: $iscc"
          }
          "INNO_SETUP_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile installer
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:INNO_SETUP_ISCC -PathType Leaf)) {
            throw "INNO_SETUP_ISCC is missing or invalid"
          }

          & $env:INNO_SETUP_ISCC `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "installer\cnb-bridge.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer contents
        shell: pwsh
        run: |
          $setups = @(
            Get-ChildItem -LiteralPath "installer/output" -Filter "*-windows-x64-setup.exe" -File
          )
          if ($setups.Count -ne 1) {
            throw "Expected exactly one installer, found $($setups.Count)"
          }

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($setups[0].FullName)
          if ($null -eq $icon) {
            throw "Installer executable has no associated icon"
          }
          $icon.Dispose()

          $installDir = Join-Path $env:RUNNER_TEMP "cnb-bridge-install-${{ github.run_id }}"
          $arguments = @(
            "/VERYSILENT"
            "/SUPPRESSMSGBOXES"
            "/NORESTART"
            "/NOICONS"
            "/LANG=chinesesimp"
            "/DIR=$installDir"
          )
          $process = Start-Process -FilePath $setups[0].FullName -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)"
          }

          foreach ($file in @("cnb-bridge.exe", "vcruntime140.dll", "app.ico")) {
            $installedFile = Join-Path $installDir $file
            if (-not (Test-Path -LiteralPath $installedFile -PathType Leaf)) {
              throw "Installer did not install $file"
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cnb-bridge-v${{ steps.version.outputs.version }}-windows-x64-setup
          path: installer/output/cnb-bridge-v${{ steps.version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
