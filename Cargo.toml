[package]
name = "cnb-bridge"
version = "0.1.0"
edition = "2021"
description = "CNB Bridge: a local AI bridge for CNB cloud workspaces"
license = "MIT"
publish = false

[workspace]
members = ["src-tauri"]
resolver = "2"

[lib]
name = "cnb_bridge"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
git2 = { version = "0.21", features = ["https"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
russh = { version = "0.65.1", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }
tempfile = "3.13"
thiserror = "2.0"
tokio = { version = "1.40", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
